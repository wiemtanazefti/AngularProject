<div *ngIf="suggestion">
  <h2>{{ suggestion.title }}</h2>
  <p>{{ suggestion.description }}</p>
  <p><b>Catégorie:</b> {{ suggestion.category }}</p>
  <p><b>Status:</b> {{ suggestion.status }}</p>
  <p><b>Likes:</b> {{ suggestion.nbLikes }}</p>

  <button (click)="deleteSuggestion()">🗑 Supprimer</button>
  <button (click)="goBack()">⬅ Retour</button>
</div>
